name: Build Infrastructure and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: terraform-appservice-project

jobs:

  # ============================================================
  # STAGE 1 - BUILD APPLICATION
  # ============================================================
  build:
    name: Stage 1 - Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.TF_WORKING_DIR }}/app/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.TF_WORKING_DIR }}/app
        run: npm ci

      - name: Build application
        working-directory: ${{ env.TF_WORKING_DIR }}/app
        run: npm run build --if-present

      - name: Create application package
        working-directory: ${{ env.TF_WORKING_DIR }}/app
        run: |
          zip -r ../app-package.zip . \
            -x "node_modules/*"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-application
          path: ${{ env.TF_WORKING_DIR }}/app-package.zip


  # ============================================================
  # STAGE 2 - BUILD AZURE INFRASTRUCTURE
  # ============================================================
  infrastructure:
    name: Stage 2 - Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Azure authentication using OIDC
      # --------------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Create Terraform remote state
      # --------------------------------------------------------
      - name: Create Terraform Backend
        run: |
          az group create \
            --name rg-terraform-state \
            --location IndiaSouthCentral

          az storage account create \
            --name stterraformstatepgsn \
            --resource-group rg-terraform-state \
            --location IndiaSouthCentral \
            --sku Standard_LRS \
            --kind StorageV2

          az storage container create \
            --name tfstate \
            --account-name stterraformstatepgsn \
            --auth-mode login

      # --------------------------------------------------------
      # Install Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Terraform
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Verify Terraform variables
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "Terraform working directory:"
          pwd

          echo "Files:"
          ls -la

          echo "terraform.tfvars exists:"
          test -f terraform.tfvars && echo "YES" || echo "NO"

          echo "App Service variable:"
          grep '^app_service_name' terraform.tfvars

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
          -var-file="terraform.tfvars" \
          -var="terraform_principal_id=${{ secrets.AZURE_PRINCIPAL_ID }}" \
          -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # --------------------------------------------------------
      # Display important infrastructure outputs
      # --------------------------------------------------------
      - name: Show Terraform Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "========== INFRASTRUCTURE OUTPUTS =========="

          echo "Resource Group:"
          terraform output -raw resource_group_name

          echo "App Service:"
          terraform output -raw app_service_name

          echo "App Service Hostname:"
          terraform output -raw app_service_hostname

          echo "Key Vault:"
          terraform output -raw key_vault_name

          echo "SQL Server:"
          terraform output -raw sql_server_name

          echo "SQL Database:"
          terraform output -raw sql_database_name

          echo "Application Insights:"
          terraform output -raw application_insights_name

          echo "============================================"


  # ============================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ============================================================
  application:
    name: Stage 3 - Deploy Application
    runs-on: ubuntu-latest
    needs: infrastructure

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: node-application
          path: ./artifact

      # --------------------------------------------------------
      # Azure authentication
      # --------------------------------------------------------
      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # --------------------------------------------------------
      # Get App Service name from remote Terraform state
      # --------------------------------------------------------
      - name: Get App Service name
        id: terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -reconfigure

          APP_NAME=$(terraform output -raw app_service_name)

          echo "App Service: $APP_NAME"

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------------
      # Deploy application to Azure App Service
      # --------------------------------------------------------
      - name: Deploy application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.terraform.outputs.app_name }}
          package: ./artifact/app-package.zip

      - name: Deployment completed
        run: |
          echo "============================================"
          echo "Application deployment completed"
          echo "App Service: ${{ steps.terraform.outputs.app_name }}"
          echo "============================================"